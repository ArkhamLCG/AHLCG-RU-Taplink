backend:
  name: test-repo
  branch: feat/workshop

# backend:
#   name: git-gateway
#   branch: main

media_folder: "public/images/content"
public_folder: "/images/content"

locale: 'en'

collections:
  - name: "menu"
    label: "Menu"
    label_singular: "Menu item"
    folder: "content/menu"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Название", name: "title", widget: "string"}
      - {label: "URL", name: "url", widget: "string"}
      - {label: "Порядок", name: "order", widget: "number", default: 0}
      - {label: "Активно", name: "active", widget: "boolean", default: true}
      - {label: "Внешняя ссылка", name: "external", widget: "boolean", default: false}

  - name: "pages"
    label: "Pages"
    label_singular: "Page"
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Заголовок", name: "title", widget: "string"}
      - {label: "Описание", name: "description", widget: "text"}
      - {label: "Контент", name: "body", widget: "markdown"}
      - {label: "Дата публикации", name: "date", widget: "datetime"}
      - {label: "Автор", name: "author", widget: "string"}
      - {label: "Изображение", name: "image", widget: "image", required: false}
      - {label: "Категория", name: "category", widget: "select", options: ["workshop", "guide", "news", "general"], required: false}
      - {label: "Теги", name: "tags", widget: "list", required: false}
      - {label: "Опубликовано", name: "published", widget: "boolean", default: false}