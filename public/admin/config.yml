backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

locale: 'ru'

collections:
  - name: "pages"
    label: "Страницы"
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Заголовок", name: "title", widget: "string"}
      - {label: "Описание", name: "description", widget: "text"}
      - {label: "Контент", name: "body", widget: "markdown"}
      - {label: "Дата публикации", name: "date", widget: "datetime"}
      - {label: "Автор", name: "author", widget: "string"}
      - {label: "Изображение", name: "image", widget: "image", required: false}
      - {label: "Категория", name: "category", widget: "select", options: ["workshop", "guide", "news", "general"], required: false}
      - {label: "Теги", name: "tags", widget: "list", required: false}
      - {label: "Опубликовано", name: "published", widget: "boolean", default: false}